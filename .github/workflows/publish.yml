name: Publish Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Prebuilt Linux binaries -> fast installs. Set explicitly because the repo's
  # project .Rprofile can stop R from picking up a default CRAN mirror.
  CRAN_REPO: https://packagemanager.posit.co/cran/__linux__/noble/latest
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-4.5.1-${{ hashFiles('renv.lock') }}

      - name: Install R packages
        run: Rscript .github/scripts/setup-r-libs.R

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        