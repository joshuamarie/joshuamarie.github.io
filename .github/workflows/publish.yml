name: Publish Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Prebuilt Linux binaries -> fast installs. Set explicitly because the repo's
  # project .Rprofile can stop R from picking up a default CRAN mirror.
  CRAN_REPO: https://packagemanager.posit.co/cran/__linux__/noble/latest
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-4.5.1-${{ hashFiles('renv.lock') }}
          restore-keys: r-${{ runner.os }}-4.5.1-

      - name: Install R packages
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = Sys.getenv("CRAN_REPO")))
          lib = Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))

          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv", lib = lib)

          # 1. Versions recorded in renv.lock
          renv::restore(library = lib, prompt = FALSE)

          # 2. Anything the site needs that is not in the lockfile yet
          #    (knitr/rmarkdown/downlit/xml2 are needed by Quarto itself and by `code-link`)
          needed = unique(
              c(
                  "knitr", 
                  "rmarkdown", 
                  "downlit", 
                  "xml2",
                  renv::dependencies(quiet = TRUE)$Package
              )
          )
          needed = intersect(needed, rownames(available.packages()))
          missing = setdiff(needed, rownames(installed.packages()))
          if (length(missing)) install.packages(missing, lib = lib)

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
