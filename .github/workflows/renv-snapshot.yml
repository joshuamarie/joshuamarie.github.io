name: Update renv lockfile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Mondays 00:00 UTC (08:00 Manila)

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Restores whatever is already in renv.lock
      - uses: r-lib/actions/setup-renv@v2

      - name: Install packages used by the QMDs, then snapshot
        shell: Rscript {0}
        run: |
          deps <- unique(renv::dependencies(quiet = TRUE)$Package)
          missing <- setdiff(deps, rownames(installed.packages()))
          if (length(missing)) renv::install(missing)
          renv::snapshot(type = "implicit", prompt = FALSE)

      - name: Open PR if the lockfile changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/renv-snapshot
          commit-message: "chore: update renv.lock"
          title: "chore: update renv.lock"
          body: "Automated renv snapshot of packages used in the QMD files."
          add-paths: renv.lock
  