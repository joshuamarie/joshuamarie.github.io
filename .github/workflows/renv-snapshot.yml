name: Update renv lockfile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Mondays 00:00 UTC (08:00 Manila)

permissions:
  contents: write
  pull-requests: write

env:
  CRAN_REPO: https://packagemanager.posit.co/cran/__linux__/noble/latest
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Restore, fill in missing packages, snapshot
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = Sys.getenv("CRAN_REPO")))
          lib = Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))

          install.packages("renv", lib = lib)
          renv::restore(library = lib, prompt = FALSE)

          needed = unique(
              c(
                  "knitr", 
                  "rmarkdown", 
                  "downlit", 
                  "xml2",
                  renv::dependencies(quiet = TRUE)$Package
              )
          )
          needed = intersect(needed, rownames(available.packages()))
          missing = setdiff(needed, rownames(installed.packages()))
          if (length(missing)) install.packages(missing, lib = lib)

          renv::snapshot(
              library = .libPaths(), 
              lockfile = "renv.lock",
              type = "implicit", 
              prompt = FALSE
          )

      - name: Commit lockfile if it changed
        run: |
          if [[ -n "$(git status --porcelain renv.lock)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add renv.lock
            git commit -m "chore: update renv.lock"
            git pull --rebase --autostash
            git push
          fi
