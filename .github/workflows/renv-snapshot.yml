name: Update renv lockfile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Mondays 00:00 UTC (08:00 Manila)

permissions:
  contents: write

concurrency:
  group: renv-snapshot
  cancel-in-progress: false

env:
  CRAN_REPO: https://packagemanager.posit.co/cran/__linux__/noble/latest
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Restore, update, snapshot, and check that every package loads
        run: Rscript .github/scripts/setup-r-libs.R update

      - name: Verify the site still renders with the new lockfile
        run: quarto render

      - name: Commit lockfile if it changed
        run: |
          if [[ -n "$(git status --porcelain renv.lock)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add renv.lock
            git commit -m "Update renv.lock"
            git pull --rebase --autostash
            git push
          fi
          